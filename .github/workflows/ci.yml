name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  linux:
    name: Linux (Vulkan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Vulkan (Mesa lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p wgpu-mx --features custom --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p mx-types -p mx-shader --all-features
      - name: Conformance tests on lavapipe
        run: cargo test -p mx --test conformance -- --test-threads=1
      - name: Conformance tests under the validation layer
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: "true"
        run: |
          set -o pipefail
          cargo test -p mx --test conformance -- --test-threads=1 2>&1 | tee validation.log
          ! grep -q "mX Vulkan validation error" validation.log
      - name: openOMSI's shaders on lavapipe under the validation layer
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -o pipefail
          cargo test -p mx --test openomsi_shaders -- --nocapture 2>&1 | tee shaders.log
          ! grep -q "mX Vulkan validation error" shaders.log
      - name: wgpu-mx through wgpu's API, and as a wgpu backend
        run: cargo test -p wgpu-mx --features custom
      - name: Install OpenGL (Mesa llvmpipe, EGL) and Xvfb
        run: sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri xvfb
      - name: Conformance and openOMSI's OpenGL shaders on llvmpipe (OpenGL ES, then desktop)
        env:
          MX_BACKENDS: gl
        run: |
          xvfb-run -a cargo test -p mx --test conformance --test openomsi_shaders -- --test-threads=1 --nocapture
          MX_GL_DESKTOP=1 xvfb-run -a cargo test -p mx --test conformance --test openomsi_shaders -- --test-threads=1 --nocapture
      - name: Android (Vulkan) compiles
        run: |
          rustup target add aarch64-linux-android
          cargo check -p wgpu-mx --features custom --target aarch64-linux-android

  macos:
    # (the virtual GPU of GitHub's macOS runners lacks what mX needs, so the tests on Metal
    # run on real Macs; here the Metal backend is built and linted)
    name: macOS (Metal, build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p wgpu-mx --features custom --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p mx-types -p mx-shader --all-features
      - name: iOS (Metal) compiles
        run: |
          rustup target add aarch64-apple-ios
          cargo check -p wgpu-mx --features custom --target aarch64-apple-ios

  windows:
    name: Windows (Direct3D 12)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: |
          cargo clippy -p mx-dx12 -p mx-dx11 -p mx -p mx-upscale -p wgpu-mx --all-targets -- -D warnings
          cargo clippy -p wgpu-mx --features custom --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p mx-types -p mx-shader --all-features
      - name: Conformance tests on WARP
        run: cargo test -p mx --test conformance -- --test-threads=1
      # (openOMSI's shaders through DXC, as the game ships it: the Windows SDK's dxcompiler.dll
      # and dxil.dll on the path, or mX falls back to FXC)
      - name: openOMSI's shaders through DXC on WARP
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\dxcompiler.dll" | Sort-Object FullName -Descending | Select-Object -First 1
          if ($dxc) { $env:PATH = "$($dxc.DirectoryName);$env:PATH"; Write-Host "DXC: $($dxc.FullName)" } else { Write-Host "no dxcompiler.dll in the Windows SDK: FXC" }
          cargo test -p mx --test openomsi_shaders -- --nocapture
      - name: wgpu-mx through wgpu's API, and as a wgpu backend
        run: cargo test -p wgpu-mx --features custom -- --test-threads=1
